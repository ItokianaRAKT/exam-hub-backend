version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: examhub_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - examhub_data:/var/lib/postgresql/data

volumes:
  examhub_data:
